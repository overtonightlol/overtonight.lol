<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="utf-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Supporters — overtonight</title>

    <meta
        name="description"
        content="Overtonight supporters."
    >

    <link
        rel="icon"
        type="image/png"
        href="images/icons/ovticon.png"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            overflow-x: hidden;

            background: #000;

            color: #fff;

            font-family: Arial, sans-serif;

            cursor: crosshair;

        }


        /* =========================
           HEADER
        ========================= */

        .supporters-header {

            width: 100%;

            padding:
                24px
                20px
                10px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

        }


        .supporters-header h1 {

            font-size:
                clamp(
                    24px,
                    4vw,
                    48px
                );

            letter-spacing: 3px;

            text-transform: uppercase;

        }


        .home-link {

            color: #fff;

            text-decoration: none;

            border: 1px solid #fff;

            padding:
                10px
                14px;

            font-size: 13px;

            letter-spacing: 1px;

            text-transform: uppercase;

            transition:
                background 0.2s ease,
                color 0.2s ease;

        }


        .home-link:hover {

            background: #fff;

            color: #000;

        }


        /* =========================
           SUPPORTER GRID
        ========================= */

        .supporters-grid {

            width: 100%;

            max-width: 1600px;

            margin: 0 auto;

            padding: 20px;

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(
                        280px,
                        1fr
                    )
                );

            gap: 20px;

        }


        .supporter-card {

            overflow: hidden;

            scroll-margin-top: 20px;

        }


        .supporter-card img {

            width: 100%;

            height: auto;

            display: block;

            cursor: pointer;

            transition:
                transform 0.2s ease;

        }


        .supporter-card img:hover {

            transform: scale(1.02);

        }


        /* =========================
           IMAGE MODAL
        ========================= */

        .image-modal-overlay {

            position: fixed;

            inset: 0;

            z-index: 5000;

            background:
                rgba(
                    0,
                    0,
                    0,
                    0.85
                );

            display: flex;

            align-items: center;

            justify-content: center;

            opacity: 0;

            visibility: hidden;

            pointer-events: none;

            transition:
                opacity 0.3s ease,
                visibility 0.3s ease;

        }


        .image-modal-overlay.active {

            opacity: 1;

            visibility: visible;

            pointer-events: auto;

        }


        .expanded-image {

            max-width: 90%;

            max-height: 85vh;

            object-fit: contain;

            border-radius: 4px;

            box-shadow:
                0 4px 20px
                rgba(
                    0,
                    0,
                    0,
                    0.5
                );

        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 600px) {

            .supporters-header {

                padding:
                    18px
                    12px
                    8px;

            }


            .supporters-grid {

                padding: 12px;

                grid-template-columns:
                    1fr;

            }

        }

    </style>

</head>


<body>


    <!-- =========================
         IMAGE MODAL
    ========================= -->

    <div
        class="image-modal-overlay"
        id="imageModal"
    >

        <img
            src=""
            alt="Expanded View"

    <!-- =========================

    </main>


    <!-- =========================
         IMAGE ZOOM JAVASCRIPT
    ========================= -->

    <script>

        const modal =
            document.getElementById(
                "imageModal"
            );


        const expandedImage =
            document.getElementById(
                "expandedImg"
            );


        const supporterImages =
            document.querySelectorAll(
                ".supporter-card img"
            );


        supporterImages.forEach(
            image => {

                image.addEventListener(
                    "click",
                    () => {

                        expandedImage.src =
                            image.src;

                        expandedImage.alt =
                            image.alt;

                        modal.classList.add(
                            "active"
                        );

                    }
                );

            }
        );


        modal.addEventListener(
            "click",
            () => {

                modal.classList.remove(
                    "active"
                );

                expandedImage.src = "";

            }
        );


        /* Close with Escape */

        document.addEventListener(
            "keydown",
            event => {

                if (
                    event.key === "Escape"
                ) {

                    modal.classList.remove(
                        "active"
                    );

                    expandedImage.src = "";

                }

            }
        );

    </script>


</body>
