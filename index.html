<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>overtonight</title>
<meta name="description" content="Overtonight's Deepest Darkest Secrets...">
<meta name="keywords" content="overtonight, ovt, tankboy, ghostboy">
<meta name="robots" content="index, follow">


<!-- Custom Website Icon -->
<link rel="icon" type="image/png" href="images/ovticon.png">

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    overflow: hidden;
    background: #000;
    font-family: Arial, sans-serif;
    cursor: crosshair;
}

/* =========================
   COMING SOON
   ========================= */

.coming-soon {
    position: fixed;
    inset: 0;
    z-index: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #fff;
    text-align: center;

    font-size: clamp(32px, 6vw, 64px);
    letter-spacing: 8px;
    text-transform: uppercase;

    user-select: none;
    pointer-events: none;
}

/* =========================
   SPARKLE CURSOR
   ========================= */

#sparkles {
    position: fixed;
    inset: 0;
    z-index: 3000;

    width: 100vw;
    height: 100vh;

    pointer-events: none;
}
</style>

</head>

<body>

<!-- Coming Soon -->

<div class="coming-soon">
    coming soon
</div>

<!-- Cursor Effect -->

<canvas id="sparkles"></canvas>

<!-- Music -->

<audio id="siteAudio" preload="auto" loop>
    <source src="hotel_room.mp3" type="audio/mp3">
</audio>

<script>

/* =========================
   AUDIO SETTINGS
   ========================= */

const AUDIO_VOLUME = 0.1;
const AUDIO_START_TIME = 0;

const audio = document.getElementById("siteAudio");

audio.volume = AUDIO_VOLUME;
audio.currentTime = AUDIO_START_TIME;

/*
   Browsers may block autoplay with sound.
   If blocked, the first user interaction
   will start the music.
*/

audio.play().catch(() => {

    const startAudio = () => {

        audio.play().catch(() => {});

        document.removeEventListener("click", startAudio);
        document.removeEventListener("mousemove", startAudio);
        document.removeEventListener("keydown", startAudio);

    };

    document.addEventListener("click", startAudio);
    document.addEventListener("mousemove", startAudio);
    document.addEventListener("keydown", startAudio);

});


/* =========================
   SPARKLE CURSOR
   ========================= */

const canvas = document.getElementById("sparkles");
const ctx = canvas.getContext("2d");

const sparkleImage = new Image();

sparkleImage.src = "images/ovtcursor.png";

let particles = [];


/* =========================
   CANVAS SIZE
   ========================= */

function resizeCanvas() {

    canvas.width = innerWidth;
    canvas.height = innerHeight;

}

window.addEventListener("resize", resizeCanvas);

resizeCanvas();


/* =========================
   CURSOR PARTICLES
   ========================= */

window.addEventListener("mousemove", e => {

    for (let i = 0; i < 1; i++) {

        particles.push({

            x: e.clientX,
            y: e.clientY,

            size: 10 + Math.random() * 10,

            vx: (Math.random() - .5) * 1.5,

            vy: (Math.random() - .5) * 1.5,

            life: 1,

            decay: Math.random() * .03 + .015,

            rotation: Math.random() * Math.PI * 2,

            spin: (Math.random() - .5) * .05

        });

    }

});


/* =========================
   ANIMATE PARTICLES
   ========================= */

function animate() {

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    particles = particles.filter(p => {

        p.x += p.vx;
        p.y += p.vy;

        p.life -= p.decay;

        p.rotation += p.spin;

        if (p.life <= 0) {
            return false;
        }

        if (
            sparkleImage.complete &&
            sparkleImage.naturalWidth
        ) {

            ctx.save();

            ctx.globalAlpha = p.life;

            ctx.translate(
                p.x,
                p.y
            );

            ctx.rotate(p.rotation);

            ctx.drawImage(
                sparkleImage,
                -p.size,
                -p.size,
                p.size,
                p.size
            );

            ctx.restore();
        }

        return true;

    });

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
